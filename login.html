<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Master 5.0 · Log in</title>
    <link rel="stylesheet" href="/styles/login.css">
  </head>
  <body>
    <script src="/scripts/users.js"></script>
    <script src="https://parkingmaster.tk/notiflix/notiflix-3.2.8.min.js"></script>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <img class="logo" src="/favicon.png">
          <h2>Log in</h2>
          <p>To Parking Master 5.0</p>
        </div>
        <form class="login-form" id="loginForm" novalidate>
          <div class="form-group">
            <div class="input-wrapper">
              <input type="username" id="username" name="username" required>
              <label for="username">Username</label>
            </div>
          </div>
          <div class="form-group">
            <div class="input-wrapper password-wrapper">
              <input type="password" id="password" name="password" required>
              <label for="password">Password</label>
              <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePassword(this)"><span class="eye-icon"></span></button>
            </div>
            <span class="error-message" id="loginError"></span>
          </div>
          <div class="form-options">
            <label class="remember-wrapper">
              <input type="checkbox" id="remember" name="remember" checked>
              <span class="checkbox-label"><span class="checkmark"></span> Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>
          <button type="submit" class="login-btn">
            <span class="btn-text">Log in</span>
            <span class="btn-loader"></span>
          </button>
        </form>
        <div class="signup-link">
          <p><a href="signup.html">Sign up instead</a></p>
        </div>
      </div>
    </div>
    <script>
      let verificationSuccess = new URLSearchParams(location.search).get("success");
      if (verificationSuccess != null) {
        if (verificationSuccess == "1") {
          Notiflix.Notify.success("Success! Your account has been added. Log in to access it.");
        } else {
          Notiflix.Notify.failure("Signup failed. That link might be expired.");
        }
      }
      function updateInputs(input) {
        if (input.value == "") {
          input.classList.remove("has-value");
        } else {
          input.classList.add("has-value");
        }
      }
      let username = document.querySelector("input#username");
      let password = document.querySelector("input#password");
      username.addEventListener("input", () => updateInputs(username));
      password.addEventListener("input", () => updateInputs(password));
      updateInputs(username);
      updateInputs(password);
      function togglePassword(button) {
        button.querySelector(".eye-icon").classList.toggle("show-password");
        if (password.type == "text") {
          password.type = "password";
        } else {
          password.type = "text";
        }
      }
      function login() {
        function resetButton() {
          document.querySelector("button.login-btn .btn-text").style.opacity = 1;
          document.querySelector("button.login-btn .btn-loader").style.opacity = 0;
          document.querySelector("button.login-btn").disabled = false;
        }
        document.querySelector("button.login-btn .btn-text").style.opacity = 0;
        document.querySelector("button.login-btn .btn-loader").style.opacity = 1;
          document.querySelector("button.login-btn").disabled = true;
        document.querySelector("#loginError").textContent = "";
        document.querySelector("#loginError").style.opacity = 0;
        let _username = username.value.trim();
        let _password = password.value.trim();
        users.login(_username, _password, function(success, reason) {
          if (success) {
            Notiflix.Notify.success("Welcome back " + users.data.username + "! Redirecting...");
            location.href = "/";
          } else {
            resetButton();
            if (reason == 0) {
              document.querySelector("#loginError").textContent = "That Username or Password is incorrect.";
            } else {
              document.querySelector("#loginError").textContent = "Our server is currently down. Please try again later.";
            }
            document.querySelector("#loginError").style.opacity = 1;
          }
        });
      }
      document.querySelector("button.login-btn").addEventListener("click", event => (event.preventDefault(), login()));
    </script>
  </body>
</html>
