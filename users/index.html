<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Master 5.0 · All Users</title>
    <style>
      html, body {
        margin: 0;
        background: #f2f2f2;
        font-family: Arial, Helvetica, sans-serif;
      }
      .users-wrapper {
        position: relative;
        width: 90%;
        margin: 0 auto;
        top: 50px;
        background: #ddd;
        display: flex;
        flex-wrap: wrap;
        box-sizing: border-box;
        box-shadow: 4px 4px 0 #999;
        margin-bottom: 100px;
        max-width: 1000px;
        min-width: 400px;
      }
      .user-row {
        position: relative;
        width: 100%;
        background: #fff;
        display: flex;
        margin: 10px;
        padding: 10px;
        align-items: center;
        border: 1px solid #333;
        cursor: pointer !important;
      }
      .user-row:hover {
        background: #f0f0f0;
      }
      .user-row .username, .user-row .points, .user-row .amount-cars, .user-row .join-date {
        flex: 1;
      }
      .user-row.header-row {
        color: #999;
        background: transparent;
        border: none;
      }
      h1 {
        text-align: center;
        margin-top: 30px;
        font-size: 30px;
      }
      .profile-picture {
        position: relative;
        width: 30px;
        height: 30px;
        background-size: 100%;
        background-position: center;
        margin-right: 10px;
      }
      .sort-button {
        width: 40px;
        margin-left: -5px;
        margin-right: 5px;
        background: #e9e9e9;
        border: none;
        border: 1px solid #333;
        border-radius: 10px;
        cursor: pointer;
        color: #333;
      }
      .sort-button:hover {
        background: #bbb;
      }
      .sort-button:active {
        background: #888;
      }
      .user-wrapper {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f2f2f2;
        display: none;
      }
      .user-container {
        position: absolute;
        width: 70%;
        min-width: 500px;
        left: 50%;
        top: 50px;
        margin-left: -35%;
        padding: 20px;
        box-sizing: border-box;
      }
      .user-container .user-section {
        background: #fff;
        border: 1px solid #999;
        box-shadow: 4px 4px 0 #999;
        border-radius: 0;
        box-sizing: border-box;
        display: inline-block;
      }
      .user-container .first-section {
        position: relative;
        margin-top: 20px;
        width: calc(50% - 10px);
        height: 150px;
        overflow-x: scroll !important;
        overflow-y: hidden !important;
        white-space: nowrap;
      }
      .user-container .second-section {
        position: relative;
        margin-top: 20px;
        margin-left: 15px;
        width: calc(50% - 10px);
        height: 150px;
      }
      .user-container .third-section {
        position: relative;
        margin-top: 20px;
        width: calc(50% - 10px);
        height: 300px;
      }
      .user-container .fourth-section {
        position: relative;
        margin-top: 20px;
        margin-left: 15px;
        width: calc(50% - 10px);
        height: 300px;
      }
      @media only screen and (max-width:1100px) {
        .user-container {
          width: 80% !important;
          margin-left: -40% !important;
        }
      }
      @media only screen and (max-width:710px) {
        .user-container {
          min-width: 0 !important;
          width: 100% !important;
          left: 0 !important;
          margin-left: 0 !important;
        }
      }
      @media only screen and (max-width:600px) {
        .user-section {
width: 100% !important;
margin: 0 !important;
margin-bottom: 0px;
margin-bottom: 10px !important;
        }
      }
      .user-container .user-profile-picture {
        position: relative;
        width: 125px;
        height: 125px;
        background-image: url(https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png);
        background-size: 100%;
        background-position: center;
        margin: 10px;
      }
      .user-username {
        position: absolute;
        font-size: 24px;
        top: 40px;
        left: 150px;
        max-width: calc(100% - 150px);
      }
      .user-join-date {
        position: absolute;
        font-size: 18px;
        top: 80px;
        left: 150px;
        color: #999;
      }
      .user-bio {
        position: absolute;
        width: calc(100% - 80px);
        height: calc(100% - 80px);
        margin: 40px;
        border: 1px solid #333;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        color: #333;
      }
      .user-car {
        background-size: 100% !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
      }
      .user-info {
        display: table;
        margin: 0 auto;
        margin-top: 25px;
      }
      .user-info li {
        font-size: 26px;
        list-style-type: square;
        list-style-position: inside;
        color: #333;
      }
      .user-current-car {
        position: absolute;
        width: 100%;
        text-align: center;
        bottom: 0;
        font-weight: bold;
      }
      .user-info.user-info-license {
        margin: 25px;
        float: right;
        margin-top: -125px;
      }
      @media only screen and (max-width:1000px) {
        .user-info.user-info-license li {
          font-size: 20px !important;
        }
        .user-info.user-info-license {
          margin: 10px;
          margin-top: -110px;
        }
      }
      .user-license {
        width: 100%;
        height: 100%;
        background-size: 50%;
        background-position: left center;
        background-repeat: no-repeat;
      }
    </style>
  </head>
  <body>
    <script src="/scripts/users.js"></script>
    <script src="https://parkingmaster.tk/notiflix/notiflix-3.2.8.min.js"></script>
    <h1><img src="/favicon.png" style="position: relative; height: 40px; vertical-align: middle"> All Users</h1>
    <div class="users-wrapper">
      <div class="user-row header-row">
        <button class="sort-button">Sort</button>
        <div class="username">Username</div>
        <div class="points">Points</div>
        <div class="amount-cars">Amount of Cars</div>
        <div class="join-date">Joined</div>
      </div>
    </div>
    <div class="user-wrapper"></div>
    <script>
      Notiflix.Notify.init({
        position: "left-top",
        timeout: 1000,
        info: {
          width: "300px",
          background: "#fff",
          textColor: "#333",
          notiflixIconColor: "#333"
        }
      });
      let sort = "date";
      let allUsers = null;
      let usersloaded = false;
      let onusersloaded = () => {};
      function formatNumber(number) {
        return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
      }
      function displayUsers() {
        document.querySelectorAll(".users-wrapper .user-row").forEach(x => x.className == "user-row" && x.remove());
        let sortedUsers = null;
        if (sort == "date") {
          sortedUsers = allUsers.sort(function(a, b) {
            return a.createdAt - b.createdAt;
          });
        } else if (sort == "points") {
          sortedUsers = allUsers.sort(function(a, b) {
            return a.points - b.points;
          }).reverse();
        }
        for (let i = 0; i < sortedUsers.length; i++) {
          let user = sortedUsers[i];
          let userRow = document.createElement("div");
          userRow.className = "user-row";
          userRow.innerHTML += `
          <div class="profile-picture" style="background-image:url(${user.profilePicture})"></div>
          <div class="username">${user.username}</div>
          <div class="points">${formatNumber(user.points)}</div>
          <div class="amount-cars">${user.cars.length}</div>
          <div class="join-date">${new Date(user.createdAt).toLocaleDateString()}</div>
          `;
          document.querySelector(".users-wrapper").appendChild(userRow);
          userRow.addEventListener("click", function() {
            location.hash = user.username;
          });
        }
      }
      document.querySelector(".sort-button").addEventListener("click", function() {
        if (sort == "date") {
          sort = "points";
        } else if (sort == "points") {
          sort = "date";
        }
        Notiflix.Notify.info("Sorting users by " + sort);
        displayUsers();
      });
      users.getAllUsers(function(_allUsers) {
        allUsers = _allUsers;
        usersloaded = true;
        onusersloaded();
        displayUsers();
      });

      let vehicleNames = {
        "Honda_Civic": "2018 Honda Civic Sport Touring",
        "Toyota_RAV4": "2023 Toyota RAV4",
        "Mini_Cooper": "2014 Mini Cooper S",
        "Ford_Victoria": "2010 Ford Crown Victoria",
        "Ford_F150": "2017 Ford F-150 Raptor",
        "Chevy_Camaro": "2017 Chevrolet Camaro"
      };
      let currentOpenUser = null;
      function openUser(username) {
        if (currentOpenUser == username) return;
        currentOpenUser = username;
        document.querySelector(".users-wrapper").style.display = "none";
        document.querySelector(".user-wrapper").style.display = "block";
        function next() {
          let user = allUsers.filter(user => user.username === username)[0];
          document.querySelector(".user-wrapper").innerHTML = `
          <div class="user-container">
            <div class="user-section first-section">
              <div class="user-profile-picture" style="background-image:url(${user.profilePicture})"></div>
              <div class="user-username">${user.username}</div>
              <div class="user-join-date">Joined ${new Date(user.createdAt).toLocaleDateString()}</div>
            </div>
            <div class="user-section second-section"${user.license ? " style='background:#eee'" : ""}>
              ${user.license ? `<div class="user-license" style="background-image:url(${user.license})"></div>` : ""}
              <ul class="user-info${user.license ? " user-info-license" : ""}">
                <li>${formatNumber(user.points)} PTS</li>
                <li>$${formatNumber(user.points * 100)}</li>
                <li>${user.cars.length} car${user.cars.length == 1 ? "" : "s"}</li>
              </ul>
            </div>
            <div class="user-section third-section">
              <p style="position:absolute;width: 100%;text-align:center;font-weight:bold">User bio:</p>
              <div class="user-bio"><span style="color:#aaa">This user has no bio yet.</span></div>
            </div>
            <div class="user-section fourth-section user-car" style="background-image: url(/images/cars/${user.currentCar}.png)">
              <p class="user-current-car">Car: ${vehicleNames[user.currentCar]}</p>
            </div>
          </div>
          `;
          if (user.bio) document.querySelector(".user-bio").textContent = user.bio;
        };
        if (usersloaded) {
          next();
        } else {
          onusersloaded = () => next();
        }
      }
      function hideUser() {
        if (currentOpenUser == null) return;
        currentOpenUser = null;
        document.querySelector(".users-wrapper").style.display = "";
        document.querySelector(".user-wrapper").style.display = "none";
      }
      function checkUser() {
        if (location.hash) {
          let username = location.hash.split("#")[1];
          openUser(username);
        } else {
          hideUser();
        }
      }
      checkUser();
      setInterval(function() {
        checkUser();
      }, 200);
    </script>
  </body>
</html>
