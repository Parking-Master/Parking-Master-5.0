<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parking Master 5.0 · Your Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css" type="text/css">
    <script src="/scripts/jquery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(180deg);
        }
        100% { 
          transform: rotate(360deg);
        }
      }
      body {
        background: #f2f2f2;
        margin-top:20px;
      }
      .ui-w-80 {
        width: 80px !important;
        height: auto;
      }
      .btn-default {
        border-color: rgba(24,28,33,0.1);
        background: transparent;
        color: #4E5155;
      }
      .btn-primary {
        background: #333;
      }
      label.btn {
        margin-bottom: 0;
      }
      .btn-outline-primary {
        border-color: #333;
        background: transparent;
        color: #333;
      }
      .btn:hover {
        background: #333 !important;
        color: #eee;
      }
      .btn:active {
        background: #333 !important;
        color: #eee;
        transform: scale(.9);
      }
      .btn:focus {
        background: #333 !important;
        color: #eee;
      }
      .btn:disabled {
        background: #999 !important;
        pointer-events: none !important;
        border: none;
        color: #eee;
      }
      .btn {
        cursor: pointer;
      }
      .text-light {
        color: #babbbc !important;
      }
      .card {
        background-clip: padding-box;
        box-shadow: 0 1px 4px rgba(24,28,33,0.012);
      }
      .row-bordered {
        overflow: hidden;
      }
      .account-settings-fileinput {
        position: absolute;
        visibility: hidden;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .account-settings-links .list-group-item.active {
        font-weight: bold !important;
      }
      html:not(.dark-style) .account-settings-links .list-group-item.active {
        background: transparent !important;
      }
      .account-settings-multiselect ~ .select2-container {
        width: 100% !important;
      }
      .light-style .account-settings-links .list-group-item {
        padding: 0.85rem 1.5rem;
        border-color: rgba(24, 28, 33, 0.03) !important;
      }
      .light-style .account-settings-links .list-group-item.active {
        color: #4e5155 !important;
      }
      .material-style .account-settings-links .list-group-item {
        padding: 0.85rem 1.5rem;
        border-color: rgba(24, 28, 33, 0.03) !important;
      }
      .material-style .account-settings-links .list-group-item.active {
        color: #4e5155 !important;
      }
      .dark-style .account-settings-links .list-group-item {
        padding: 0.85rem 1.5rem;
        border-color: rgba(255, 255, 255, 0.03) !important;
      }
      .dark-style .account-settings-links .list-group-item.active {
        color: #fff !important;
      }
      .light-style .account-settings-links .list-group-item.active {
        color: #4E5155 !important;
      }
      .light-style .account-settings-links .list-group-item {
        padding: 0.85rem 1.5rem;
        border-color: rgba(24,28,33,0.03) !important;
      }
      .text-right.mt-3 {
        padding: 10px;
      }
      .spinner {
        position: relative;
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid transparent;
        border-top: 2px solid #333;
        border-radius: 100%;
        animation: spin 1s linear infinite;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <script src="/scripts/users.js"></script>
    <div class="container light-style flex-grow-1 container-p-y">
      <h4 class="font-weight-bold py-3 mb-4">Account settings</h4>
      <div class="card overflow-hidden">
        <div class="row no-gutters row-bordered row-border-light">
          <div class="col-md-3 pt-0">
            <div class="list-group list-group-flush account-settings-links">
              <a class="list-group-item list-group-item-action active" data-toggle="list" href="#account-profile">Profile</a>
              <a class="list-group-item list-group-item-action" data-toggle="list" href="#account-change-password">Change password</a>
              <a class="list-group-item list-group-item-action logout-button" data-toggle="list" href="#" onclick="logout()">Log out</a>
            </div>
          </div>
          <div class="col-md-9">
            <div class="tab-content">
              <div class="tab-pane fade active show" id="account-profile">
                <div class="card-body media align-items-center">
                  <img src="https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png" class="d-block ui-w-80 profile-picture">
                  <div class="media-body ml-4">
                    <label class="btn btn-outline-primary">Upload new photo
                      <input type="file" class="account-settings-fileinput" onchange="uploadProfilePicture(this)">
                    </label> &nbsp; <button type="button" class="btn btn-default md-btn-flat" onclick="uploadProfilePicture(null)">Reset</button>
                    <div class="text-light small mt-1">Any image format allowed. Max size of 20 MB.</div>
                  </div>
                </div>
                <hr class="border-light m-0">
                <div class="card-body">
                  <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control mb-1 username-input" autocomplete="new-password" oninput="updateUsername(this.value)">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Email Address (not visible to other players)</label>
                    <input type="text" class="form-control mb-1 email-input" readonly>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Bio</label>
                    <textarea class="form-control bio-input" rows="5" placeholder="Enter your bio here (optional)" oninput="updateBio(this.value)"></textarea>
                  </div>
                </div>
              </div>
              <div class="tab-pane fade" id="account-change-password">
                <div class="card-body pb-2">
                  <div class="form-group">
                    <label class="form-label">Current password</label>
                    <input type="password" class="form-control">
                  </div>
                  <div class="form-group">
                    <label class="form-label">New password</label>
                    <input type="password" class="form-control">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Repeat new password</label>
                    <input type="password" class="form-control">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="text-right mt-3">
          <button type="button" class="btn btn-primary save-profile-button" onclick="saveProfile()" disabled>Save changes</button>&nbsp; <button type="button" class="btn btn-default" onclick="location.reload()">Cancel</button>
        </div>
      </div>
    </div>
    <script>
      document.querySelector(".save-profile-button").disabled = "disabled";
      let settings = {
        profilePicture: null,
        username: null,
        bio: null
      };
      if (users.loggedIn) {
        document.querySelector(".profile-picture").src = users.data.profilePicture;
        document.querySelector(".username-input").value = users.data.username;
        document.querySelector(".email-input").value = users.data.email;
        document.querySelector(".bio-input").value = users.data.bio;
        settings.profilePicture = users.data.profilePicture;
        settings.username = users.data.username;
        settings.bio = users.data.bio;
      } else {
        location.replace("/");
      }
      function uploadProfilePicture(input) {
        document.querySelector(".save-profile-button").disabled = "";
        if (input == null) {
          document.querySelector(".profile-picture").src = "https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png";
          settings.profilePicture = "https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png";
          return;
        }
        const file = input.files[0];
        const reader = new FileReader();
        reader.addEventListener("load", function() {
          if (reader.result.length >= 20 * 1024 * 1024) {
            swal({
              text: "Profile picture must be smaller than 20 MB.",
              buttons: "Close",
              closeOnEsc: false,
              closeOnClickOutside: false
            });
          } else {
            document.querySelector(".profile-picture").src = reader.result;
            settings.profilePicture = reader.result;
          }
        });
        if (file) reader.readAsDataURL(file);
      }
      function updateUsername(username) {
        settings.username = username;
        if (username == users.data.username) {
          document.querySelector(".save-profile-button").disabled = "disabled";
        } else {
          document.querySelector(".save-profile-button").disabled = "";
        }
      }
      function updateBio(bio) {
        settings.bio = bio;
        if (bio == users.data.bio) {
          document.querySelector(".save-profile-button").disabled = "disabled";
        } else {
          document.querySelector(".save-profile-button").disabled = "";
        }
      }
      function saveProfile() {
        document.querySelector(".save-profile-button").disabled = "disabled";
        for (setting in settings) {
          if (users.data[setting] != settings[setting]) {
            users.set(setting, settings[setting]);
          }
        }
      }
      let loggingOut = false;
      function logout() {
        if (loggingOut) return;
        loggingOut = true;
        document.querySelector(".logout-button").innerHTML = 'Log out <div class="spinner"></div>';
        users.logout();
      }
    </script>
  </body>
</html>
