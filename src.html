<!DOCTYPE html>
<html>
  <head>
    <title>Parking Master 5.0 · Level 1</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
      @font-face {
        font-family: "Toxigenesis";
        src: url(/fonts/Toxigenesis.ttf);
      }
      @font-face {
        font-family: "Brittany";
        src: url(/fonts/Brittany.ttf);
      }
      @keyframes prize {
        0% {
          box-shadow: none;
        }
        50% {
          box-shadow: 0 0 0 6px gold;
        }
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(180deg);
        }
        100% { 
          transform: rotate(360deg);
        }
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none !important;
        -webkit-touch-callout: none !important;
        background-color: #f7f7f7;
      }
      canvas {
        position: absolute;
        width: 100% !important;
        height: 100% !important;
      }
      .ui {
        z-index: 10;
        pointer-events: none !important;
      }
      .swal-overlay {
        background: rgba(0, 0, 0, 0.2);
      }
      .swal-modal {
        width: 350px;
        background: rgba(150, 150, 190, 0.6);
        border: 1px solid #97b7ff;
        color: #fff;
        border-radius: 2px;
        font-family: "Toxigenesis", Arial;
      }
      .swal-title {
        color: #fff;
        font-size: 40px;
      }
      .swal-text {
        color: #fff;
        text-align: center;
      }
      .swal-icon img {
        width: 75px;
      }
      .swal-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .swal-button {
        font-family: "Toxigenesis", Arial;
        border-radius: 2px;
        padding: 4px 20px;
        background-color: #34a0ff;
        color: #fff;
      }
      .loading {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        background-size: cover;
        background-position: center;
        z-index: 99999;
        pointer-events: none;
        transition: opacity .5s;
        background-color: #fff;
      }
      .loading-banner {
        position: absolute;
        width: 100%;
        height: 120px;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), #000);
      }
      .loading-text {
        color: #eee;
        font-family: "Toxigenesis", Arial;
        font-size: 50px;
        vertical-align: middle;
        line-height: 120px;
        padding-left: 50px;
      }
      .progress-bar {
        position: relative;
        top: 0;
        width: 0;
        height: 5px;
        background: #34a0ff;
        transition: width 2s ease-out;
      }
      .howtoplay {
        position: absolute;
        height: 100px;
        right: 70px;
        bottom: 20px;
        z-index: 10;
        pointer-events: none !important;
      }
      .mobile-ui {
        position: absolute;
        z-index: 9998;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: none;
      }
      .mobile-ui * {
        pointer-events: auto;
        user-select: none !important;
      }
      .mobile-ui .pedal {
        -webkit-tap-highlight-color: transparent;
        transition: transform .5s ease-out;
        border: none;
      }
      .mobile-ui .pedal.left-pedal {
        position: absolute;
        bottom: 200px;
        right: 100px;
        width: 100px;
        height: 100px;
        background-image: url(/images/mobile-ui/left-pedal.png);
        background-color: transparent;
        background-repeat: no-repeat;
        background-size: 100px;
      }
      .mobile-ui .pedal.right-pedal {
        position: absolute;
        bottom: 160px;
        right: 10px;
        width: 70px;
        height: 160px;
        background-image: url(/images/mobile-ui/right-pedal.png);
        background-color: transparent;
        background-repeat: no-repeat;
        background-size: 70px;
      }
      .mobile-ui .steering-wheel {
        position: absolute;
        bottom: 220px;
        width: 200px;
        height: 200px;
        left: 0;
        background-image: url(/images/mobile-ui/steering-wheel.png);
        background-repeat: no-repeat;
        background-size: cover;
        transition: transform .1s;
      }
      .mobile-ui .shifter-wrapper {
        position: absolute;
        width: 35px;
        height: 105px;
        right: 10px;
        bottom: 350px;
      }
      .mobile-ui .shifter-wrapper .button {
        position: relative;
        width: 35px;
        height: 35px;
        margin: 0;
        border-radius: 0;
        background: #333;
        color: #eee;
        font-size: 18px;
        font-family: "Toxigenesis", Arial;
        border: none;
        border-top: 1px solid #555;
      }
      .mobile-ui .button.switch-view, .mobile-ui .button.park, .mobile-ui .button.pause {
        position: absolute;
        right: 10px;
        padding: 10px;
        border-radius: 0;
        background: #333;
        color: #eee;
        font-size: 18px;
        font-family: "Toxigenesis", Arial;
        border: none;
        border-top: 4px solid #555;
      }
      .mobile-ui .button.switch-view {
        bottom: 20px;
      }
      .mobile-ui .button.park {
        bottom: 80px;
      }
      .mobile-ui .button.pause {
        bottom: 20px;
        right: 100px;
      }
      .mobile-ui .button.pause img {
        filter: invert(1);
        width: 18px;
      }
      @media only screen and (max-height:450px) {
        .loading-banner {
          height: 60px;
        }
        .loading-text {
          font-size: 30px;
          line-height: 60px;
        }
        .mobile-ui .steering-wheel {
          width: 140px;
          height: 140px;
          bottom: 210px;
        }
        .mobile-ui .button.switch-view, .mobile-ui .button.park, .mobile-ui .button.pause {
          padding: 8px;
          font-size: 14px;
        }
        .mobile-ui .left-pedal {
          right: 75px !important;
          width: 75px !important;
          height: 75px !important;
          background-size: 75px !important;
          bottom: 110px !important;
        }
        .mobile-ui .right-pedal {
          width: 53px !important;
          height: 120px !important;
          background-size: 53px !important;
          bottom: 70px !important;
        }
        .mobile-ui .button.switch-view {
          right: 80px;
        }
        .mobile-ui .button.park {
          bottom: 20px;
        }
        .mobile-ui .button.pause {
          right: 150px;
        }
        .mobile-ui .shifter-wrapper {
          bottom: 210px;
        }
      }
      #game {
        position: absolute;
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden !important;
      }
      #game[data-reduce-screen-size] {
        transform: scale(0.7);
        border-radius: 10px;
      }
      #pause-menu {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: 0;
        background: rgba(0, 0, 0, 0.6);
        font-family: "Toxigenesis", Arial;
        text-align: center;
        z-index: 9999;
        display: none;
      }
      #pause-menu-header {
        font-size: 26px;
        color: #eee;
      }
      .pause-menu-wrapper {
        position: relative;
        width: 150px;
        left: 50%;
        margin-left: -75px;
        top: 25%;
        color: #eee;
      }
      .pause-menu-wrapper label {
        font-size: 12px;
      }
      button.pause-menu-button {
        display: block;
        width: 100%;
        background: #eee;
        color: #333;
        border: none;
        border-radius: 2px;
        margin-top: 20px;
        font-size: 14px;
        padding: 6px 2px;
      }
      .pause-menu-2 {
        text-align: left;
        border: 1px solid #fff;
        padding: 20px;
        background: #000;
        width: 500px;
        margin-left: -250px;
        box-sizing: border-box;
      }
      .prize-card {
        width: 80px;
        height: 80px;
        border: 4px solid #fff;
        box-shadow: -4px 8px 0px rgba(0, 0, 0, 0.5);
        margin: 4px;
        display: inline-block;
        background-position: center;
        background-size: 100%;
        background-repeat: no-repeat;
      }
      img.prize {
        width: 200px;
      }
      .spinner {
        position: absolute;
        width: 100px;
        height: 100px;
        border: 10px solid #eee;
        border-radius: 100%;
        border-top: 10px solid transparent;
        left: 50%;
        top: 50%;
        margin-left: -50px;
        margin-top: -50px;
        box-sizing: border-box;
        animation: spin 2s linear infinite;
      }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9DHE6HY00B"></script>
    <script>window.dataLayer = window.dataLayer || [];function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config', 'G-9DHE6HY00B');</script>
  </head>
  <body>
    <script src="/scripts/users.js"></script>
    <script src="/scripts/three.js"></script>
    <script src="/scripts/GLTFLoader.js"></script>
    <script src="/scripts/DecalGeometry.js"></script>
    <script src="/scripts/cannon.js"></script>
    <script src="/scripts/PointerLockControls.js"></script>
    <script src="/scripts/GamepadControls.js"></script>
    <script src="/scripts/TouchScreenControls.js"></script>
    <script src="/scripts/particles.js"></script>
    <script src="/scripts/lensflare.js"></script>
    <script src="/scripts/sounds.js"></script>
    <script src="/scripts/sweetalert.js"></script>
    <script src="https://parkingmaster.tk/notiflix/notiflix-3.2.8.min.js"></script>
    <div id="game">
      <canvas class="ui"></canvas>
      <div class="mobile-ui">
        <button class="pedal left-pedal"></button>
        <button class="pedal right-pedal"></button>
        <div class="shifter-wrapper">
          <button class="button shifter-button-park" ontouchstart="utils.game.controls.shift('park')">P</button>
          <button class="button shifter-button-reverse" ontouchstart="utils.game.controls.shift('reverse')">R</button>
          <button class="button shifter-button-drive" ontouchstart="utils.game.controls.shift('drive')">D</button>
        </div>
        <button class="button park" ontouchstart="utils.game.controls.simplePark()">Park!</button>
        <button class="button switch-view" ontouchstart="utils.game.controls.switchView()">View</button>
        <button class="button pause" ontouchstart="utils.game.pause()">Pause</button>
        <div class="steering-wheel"></div>
      </div>
      <img class="howtoplay" src="/images/howtoplay.png">
    </div>
    <div id="pause-menu">
      <div class="pause-menu-wrapper pause-menu-1">
        <h1 id="pause-menu-header">Paused</h1>
        <button class="pause-menu-button" onclick="utils.game.pause()">Resume</button>
        <button class="pause-menu-button" onclick="location.replace('/')">Main Menu</button>
        <button class="pause-menu-button" onclick="location.replace('/help.html')">Help</button>
        <button class="pause-menu-button" onclick="this.parentElement.nextElementSibling.style.display = '', this.parentElement.style.display = 'none'">Performance Settings</button>
      </div>
      <div class="pause-menu-wrapper pause-menu-2" style="display: none;">
        <h1 id="pause-menu-header">Performance</h1>
        <button class="pause-menu-button" onclick="this.parentElement.previousElementSibling.style.display = '', this.parentElement.style.display = 'none'">&leftarrow; Go back</button>
        <label for="slider">Performance</label>
        <br>
        <input type="range" name="slider" min="25" max="100" step="25" oninput="settings.performance.slider = this.value, updateSettings()">
        <br>
        <label for="resolution" id="performance-slider-percent">75%</label>
        <hr>
        <label for="resolution">Resolution</label>
        <br>
        <input type="range" name="resolution" min="10" max="100" oninput="settings.performance.resolution = this.value, updateSettings(false)">
        <label for="resolution" id="performance-resolution-percent">70%</label>
        <br>
        <input type="checkbox" name="reduce-screen-size" onchange="settings.performance.reduceScreenSize = this.checked, updateSettings(false)">
        <label for="reduce-screen-size">Reduce Screen Size: Scales down the game screen to improve framerate without lowering quality.</label><br>
        <input type="checkbox" name="background-cars" onchange="settings.performance.backgroundCars = this.checked, updateSettings(false)">
        <label for="background-cars">Background Cars: Controls whether to show fake cars on the highway.</label><br>
        <input type="checkbox" name="replay" onchange="settings.performance.replay = this.checked, updateSettings(false)">
        <label for="replay">Enable Replay: Whether to automatically record gameplay so you can rewatch it (heavy on performance).</label><br>
      </div>
    </div>
    <div class="loading">
      <div class="loading-banner">
        <div class="progress-bar"></div>
        <div class="loading-text">Loading...</div>
      </div>
    </div>
    <div style="position:absolute;font-family:'Brittany';opacity:0">.</div>
    <script src="/scripts/src.js"></script>
  </body>
</html>
