<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Master 5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        font-family: Arial, Helvetica, sans-serif;
      }
      .nav-bar {
        position: absolute;
        width: 100%;
        height: 100px;
        left: 0;
        right: 0;
        top: 0;
        margin: 0;
      }
      .nav-bar .button.nav-button {
        position: relative;
        background: #aab7ec;
        border: 4px solid #98b6fc;
        border-radius: 10px;
        background-size: 50%;
        background-repeat: no-repeat;
        background-position: center;
        box-shadow: 0 4px 0 #ddd;
        cursor: pointer;
        color: #fff;
        font-size: 18px;
        padding: 2px 10px;
        top: 20px;
        left: 20px;
        margin-left: 8px;
      }
      .nav-bar .button.nav-button-settings {
        width: 36px;
        height: 36px;
        background-image: url(images/menu/settings.png);
        background-size: 100%;
        float: right;
        left: -20px;
      }
      .header {
        position: relative;
        z-index: 6;
        pointer-events: none !important;
      }
      .header .heading {
        position: relative;
        color: #fff;
        /* text-shadow: -2px -2px 0 #333, 2px -2px 0 #333, -2px 2px 0 #333, 2px 2px 0 #333; */
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 2px;
        -webkit-text-stroke-color: #333;
        font-weight: 600;
        font-size: 65px;
        text-align: center;
        margin: 0;
        top: 20px;
      }
      .header .version {
        text-align: center;
        font-size: 150px;
        font-weight: 600;
        color: #999;
        text-shadow: 5px 10px #000;
        letter-spacing: 8px;
        font-family: "Roboto", Arial;
      }
      .buttons-wrapper {
        position: absolute;
        width: 900px;
        height: 210px;
        left: 50%;
        top: 50%;
        margin-left: -450px;
        margin-top: -30px;
        z-index: 3;
      }
      .buttons-wrapper .button {
        position: absolute;
        width: 100px;
        height: 100px;
        background: #aab7ec;
        border: 4px solid #98b6fc;
        border-radius: 100%;
        background-size: 50%;
        background-repeat: no-repeat;
        background-position: center;
        box-shadow: 0 6px 0 #ddd;
        cursor: pointer;
      }
      .buttons-wrapper .play-button {
        left: 0;
        bottom: 0;
        background-image: url(images/menu/play-button.png);
      }
      .buttons-wrapper .cars-button {
        top: 0;
        left: 50%;
        margin-left: -50px;
        background-image: url(images/menu/cars-button.png);
      }
      .buttons-wrapper .multiplayer-button {
        right: 0;
        bottom: 0;
        background-image: url(images/menu/multiplayer-button.png);
      }
      .current-car-wrapper {
        position: absolute;
        bottom: 0;
        width: 850px;
        left: 50%;
        margin-left: -425px;
      }
      .current-car-wrapper .current-car-image {
        position: relative;
        width: 100%;
        top: 130px;
        margin-bottom: 10px;
      }
      .current-car-title, .current-car-text {
        position: relative;
        z-index: 2;
        text-align: center;
        font-size: 18px;
      }
      .current-car-title {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .trees {
        position: absolute;
        z-index: 5;
        width: 115%;
        margin-left: -7.5%;
        top: 100px;
        pointer-events: none !important;
      }
      .skid-marks {
        position: absolute;
        z-index: 4;
        width: 1500px;
        top: 120px;
        pointer-events: none !important;
      }
      .arrow-icon {
        float: right;
        margin-right: -10px;
      }
      .account {
        position: relative;
        width: 250px;
        float: right;
        top: 16px;
        right: 10px;
      }
      .account .profile-picture {
        width: 55px;
        height: 55px;
        background-image: url(https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png);
        background-size: 100%;
        float: left;
        margin-right: 6px;
      }
      .account .username {
        display: inline-block;
        border-bottom: 2px solid #333;
        font-size: 20px;
      }
      .account .points {
        font-size: 26px;
      }
      .copyright {
        position: absolute;
        right: 10px;
        bottom: 20px;
        z-index: 6;
        font-family: "Roboto", Arial;
        font-weight: 400;
        color: #888;
      }
      a {
        color: #9ab8ff !important;
      }
    </style>
  </head>
  <body>
    <div class="nav-bar">
      <button class="button nav-button nav-button-login" onclick="location.href = 'login.html'">Log in <img src="images/menu/arrow-right.png" class="arrow-icon"></button>
      <button class="button nav-button nav-button-login" onclick="location.href = 'signup.html'">Sign up <img src="images/menu/arrow-right.png" class="arrow-icon"></button>
      <button class="button nav-button nav-button-settings"></button>
      <div class="account">
        <div class="profile-picture"></div>
        <div class="username">GuestUser1234</div>
        <div class="points">50 PTS</div>
      </div>
    </div>
    <div class="header">
      <h1 class="heading">Parking Master</h1>
      <div class="version">5.0</div>
    </div>
    <img src="images/menu/skid-marks.png" class="skid-marks">
    <div class="wrapper">
      <div class="buttons-wrapper">
        <button class="button play-button" onclick="location.href = 'src.html'"></button>
        <button class="button cars-button" onclick="location.href = 'cars.html'"></button>
        <button class="button multiplayer-button"></button>
      </div>
      <div class="current-car-wrapper">
        <img src="images/cars/Honda_Civic.png" class="current-car-image">
        <div class="current-car-title">Current Car</div>
        <div class="current-car-text"><span style="font-weight:600">2018</span> HONDA CIVIC SPORT TOURING</p></div>
      </div>
      <div class="copyright">&copy; 2021-2026 <a href="https://github.com/Parking-Master">Parking Master</a></div>
      <img src="images/menu/trees.png" class="trees">
    </div>
  </body>
</html>
