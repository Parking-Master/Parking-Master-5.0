<!DOCTYPE html>
<html>
  <head>
    <title>cannon.js - RaycastVehicle</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
      html, body {
        margin: 0;
      }
      canvas {
        position: relative;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <script src="three.js"></script>
    <script src="GLTFLoader.js"></script>
    <script src="cannon.js"></script>
    <script src="PointerLockControls.js"></script>
    <script>
      const antialias = 0.5;
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
      const clock = new THREE.Clock();
      camera.rotation.order = "YXZ";
      directionalLight = new THREE.DirectionalLight(0xf4e6bc, 2.5);
      ambientLight = new THREE.AmbientLight(0xefe1a7, 0.6);
      renderer.shadowMap.autoUpdate = false;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.VSMShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      directionalLight.position.set(40, 50, -20);
      directionalLight.castShadow = true;
      directionalLight.shadow.camera.near = 0.01;
      directionalLight.shadow.camera.far = 500;
      directionalLight.shadow.camera.right = 30;
      directionalLight.shadow.camera.left = -30;
      directionalLight.shadow.camera.top = 30;
      directionalLight.shadow.camera.bottom = -30;
      directionalLight.shadow.mapSize.width = 1024;
      directionalLight.shadow.mapSize.height = 1024;
      directionalLight.shadow.radius = 4;
      directionalLight.shadow.bias = -0.00006;
      ambientLight.position.set(2, 1, 1);
      scene.add(directionalLight);
      scene.add(ambientLight);

      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      scene.add(camera);

      function onWindowResize() {
        renderer.setPixelRatio(1.1);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth * 0.5, window.innerHeight * 0.5, false);
      }
      window.addEventListener("resize", onWindowResize);
      onWindowResize();

      let frameCount = 0;
      let lastTime = performance.now();
      let fps = 0;
      let brake = 0;
      let timeOfBrake = null;
      function animate(now) {
        const deltaTime = Math.min(0.04, clock.getDelta());
        const time = Date.now();
        world.step(deltaTime);

        utils.vehicle.updatePhysics();
        utils.vehicle.updateSteering(deltaTime);
        utils.vehicle.updateThrottle();
        utils.vehicle.updateBrakes(deltaTime, time);
        utils.vehicle.updateView();
        utils.vehicle.updateLights(time);

        const spawnFactor = Math.floor(Math.random() * 100);
        if (spawnFactor <= 10) {
          const newPropCar = propCars[Math.floor(Math.random() * propCars.length)];
          if (newPropCar && spawnedPropCars.indexOf(newPropCar) == -1 && time - lastPropCarSpawn > 800) {
            lastPropCarSpawn = time;
            if (spawnFactor <= 5) {
              newPropCar.rotation.set(-Math.PI / 2 - 0.05, -0.01, -Math.PI / 2);
              newPropCar.position.set(300, 0.2, 17);
              newPropCar.direction = 1;
            } else {
              newPropCar.rotation.set(-Math.PI / 2 - 0.05, 0.01, Math.PI / 2);
              newPropCar.position.set(-300, 0.4, 24);
              newPropCar.direction = -1;
            }
            spawnedPropCars.push(newPropCar);
          }
        }
        for (let i = 0; i < spawnedPropCars.length; i++) {
          const propCar = spawnedPropCars[i];
          if (propCar.position.x > -301 && propCar.position.x < 301) {
            propCar.position.x += -25 * propCar.direction * deltaTime;
          } else {
            spawnedPropCars.splice(spawnedPropCars.indexOf(propCar), 1);
          }
        }

        frameCount++;
        const diff = now - lastTime;
        if (diff >= 1000) {
          fps = (frameCount * 1000) / diff;
          frameCount = 0;
          lastTime = now;
          console.log('FPS:', fps.toFixed(1));
        }

        if (vehicle) {
          if (frameCount % 3 == 0 && vehicle.speed > 0.2) {
            vehicle.model.visible = false;
            renderer.setRenderTarget(utils.vehicle.mirrorRenderTarget);
            renderer.render(scene, vehicle.model.getObjectByName("Mirror_L_Camera"));
            renderer.setRenderTarget(null);
            vehicle.model.visible = true;
          }
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      let keyStates = {};
      let vehicle = null;
      let propCars = [];
      let lastPropCarSpawn = null;
      let spawnedPropCars = [];
      let vehicleBodies = [];
      let vehicleMeshes = [];
      const world = new CANNON.World();
      world.gravity.set(0, -9.82, 0);

      let options = { carHeadingMaxIncrement: 11, carHeadingIncrement: 0 };

      let chosenVehicle = "Honda_Civic_Sport_Touring";
      utils = {
        vehicles: {
          "Honda_Civic_Sport_Touring": {
            physics: {
              brake: false,
              throttle: false,
              blinker: false,
              lastBlinker: null,
              autoBlinker: false,
              drivetrain: "fwd",
              brakes: "awb",
              engineForce: 5000,
              heading: 0,
              wheelTurnRatio: 12,
              frontArea: 2.2,
              rearArea: 2.7,
              weight: 1416,
              wheelWeight: 10,
              lastRotation: 0
            },
            views: [
              [0.35, 0.35, -0.2, 0, Math.PI, 0],
              [0, 1.1, -6, 0.08, Math.PI, 0],
              [1.2, 0, -3, 0.05, Math.PI, 0],
              [0, 0.4, 4.5, -0.1, 0, 0],
            ]
          }
        },
        vehicle: {
          mirrorRenderTarget: new THREE.WebGLRenderTarget(200, 200),
          envMap: null,
          lightsInUse: {
            "brake": false,
            "reverse": false,
            "blinker_l": false,
            "blinker_r": false
          },
          initialize: function() {
            vehicle = new CANNON.RaycastVehicle({ indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2 });
            vehicle.physics = utils.vehicles[chosenVehicle].physics;
            new THREE.TextureLoader().load("1.png", function(texture) {
              utils.vehicle.envMap = new THREE.PMREMGenerator(renderer).fromEquirectangular(texture).texture;
              new THREE.GLTFLoader().load(chosenVehicle + ".glb", function(model) {
                vehicle.model = model.scene;
                vehicle.model.traverse(child => {
                  if (child.material) child.material.vertexColors = false;
                  if (child.name == "Exterior" || child.name == "Windows" || child.name == "Mirror_M" || child.name == "Mirror_R") {
                    child.material.envMap = utils.vehicle.envMap;
                  } else if (child.name == "Shadow") {
                    child.shadowSize = [child.scale.x, child.scale.y];
                    vehicle.shadow = child;
                    scene.add(vehicle.shadow);
                  } else if (child.name == "Chassis") {
                    child.rotation.order = "YXZ";
                    vehicle.mesh = child;
                    const chassisSize = new THREE.Box3().setFromObject(vehicle.mesh).getSize(new THREE.Vector3());
                    vehicle.chassisBody = new CANNON.Body({ mass: vehicle.physics.weight - vehicle.physics.wheelWeight * 4, shape: new CANNON.Box(new CANNON.Vec3(chassisSize.x / 2, chassisSize.y / 2, chassisSize.z / 2)), material: carMaterial });
                    vehicle.body = vehicle.chassisBody;
                  }
                });
                const options = {
                  radius: 0.33,
                  directionLocal: new CANNON.Vec3(0, -1, 0),
                  suspensionStiffness: 30,
                  suspensionRestLength: 0.18,
                  frictionSlip: 2,
                  dampingRelaxation: 6,
                  dampingCompression: 4.5,
                  maxSuspensionForce: 120000,
                  maxSuspensionTravel: 1,
                  rollInfluence: 0.08,
                  axleLocal: new CANNON.Vec3(-1, 0, 0),
                  chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0)
                };
                for (let i = 0; i < 4; i++) {
                  const wheelMesh = vehicle.model.getObjectByName("Wheels").children[i];
                  options.chassisConnectionPointLocal.copy(wheelMesh.position);
                  vehicle.addWheel(options);
                  const wheel = vehicle.wheelInfos[i];
                  wheel.index = i;
                  const wheelBody = new CANNON.Body({ mass: vehicle.physics.wheelWeight, material: wheelMaterial });
                  const q = new CANNON.Quaternion();
                  q.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), Math.PI / 2);
                  wheelBody.addShape(new CANNON.Cylinder(wheel.radius, wheel.radius, wheel.radius / 2, 20), new CANNON.Vec3(), q);
                  wheel.body = wheelBody;
                  wheel.mesh = wheelMesh;
                }
                vehicle.body.position.y = 1;
                vehicle.addToWorld(world);
                scene.add(vehicle.model);
                utils.game.controls.stopBrake();
                utils.vehicle.setLights(false);
                utils.map.initialize();
              });
            });
          },
          updateBrakes: function(deltaTime, time) {
            vehicle.setBrake(0, 0);
            vehicle.setBrake(0, 1);
            vehicle.setBrake(0, 2);
            vehicle.setBrake(0, 3);
            if (vehicle.physics.brake) {
              if (timeOfBrake == null) timeOfBrake = time;
              const brakeTime = time - timeOfBrake;
              brake = brakeTime < 700 ? 200 : 200 + Math.min((brakeTime - 700) * deltaTime * 20, 600);
            } else {
              timeOfBrake = null;
              brake = 0;
            }
            if (!vehicle.physics.throttle) {
              const brakeForce = Math.abs(vehicle.currentVehicleSpeedKmHour) < 0.5 ? 500 : brake;
              if (vehicle.speed < 0.15 && vehicle.speed > 0.02) {
                vehicle.setBrake(10, 0);
                vehicle.setBrake(10, 1);
                vehicle.setBrake(10, 2);
                vehicle.setBrake(10, 3);
              } else {
                if (vehicle.physics.brakes == "fwb") {
                  vehicle.applyEngineForce(brakeForce * vehicle.currentVehicleSpeedKmHour, 0);
                  vehicle.applyEngineForce(brakeForce * vehicle.currentVehicleSpeedKmHour, 1);
                } else if (vehicle.physics.brakes == "rwb") {
                  vehicle.applyEngineForce(brakeForce * vehicle.currentVehicleSpeedKmHour, 2);
                  vehicle.applyEngineForce(brakeForce * vehicle.currentVehicleSpeedKmHour, 3);
                } else if (vehicle.physics.brakes == "awb") {
                  vehicle.applyEngineForce(brakeForce * vehicle.currentVehicleSpeedKmHour, 0);
                  vehicle.applyEngineForce(brakeForce * vehicle.currentVehicleSpeedKmHour, 1);
                  vehicle.applyEngineForce(brakeForce * vehicle.currentVehicleSpeedKmHour, 2);
                  vehicle.applyEngineForce(brakeForce * vehicle.currentVehicleSpeedKmHour, 3);
                }
              }
            }
          },
          updateSteering: function(deltaTime) {
            if (keyStates["ArrowLeft"]) {
              options.carHeadingIncrement = Math.min(options.carHeadingIncrement + (50 * deltaTime), options.carHeadingMaxIncrement);
            } else if (keyStates["ArrowRight"]) {
              options.carHeadingIncrement = Math.max(options.carHeadingIncrement - (50 * deltaTime), -options.carHeadingMaxIncrement);
            } else {
              if (options.carHeadingIncrement < -1 || options.carHeadingIncrement > 1) {
                options.carHeadingIncrement /= 120 * deltaTime;
              } else {
                options.carHeadingIncrement = 0;
              }
            }
            vehicle.physics.heading = Math.max(Math.min(vehicle.physics.heading + (options.carHeadingIncrement / vehicle.physics.wheelTurnRatio), 35), -35);
            vehicle.physics.heading += utils.physics.calculateHeadingReset(vehicle.physics.heading, vehicle.speed);
            const steeringValue = THREE.MathUtils.degToRad(vehicle.physics.heading);
            vehicle.setSteeringValue(steeringValue, 0);
            vehicle.setSteeringValue(steeringValue, 1);
            vehicle.model.getObjectByName("Steering_Wheel").rotation.z = -steeringValue * vehicle.physics.wheelTurnRatio;
            if (vehicle.physics.autoBlinker && Math.abs(vehicle.physics.heading) < 1) utils.game.controls.stopBlinker();
            if (Math.abs(vehicle.physics.heading) > 1 && vehicle.physics.blinker) {
              vehicle.physics.autoBlinker = true;
            } else {
              vehicle.physics.autoBlinker = false;
            }
          },
          updateThrottle: function() {
            if (vehicle.physics.throttle) {
              const engineForce = vehicle.physics.engineForce * -1;
              if (vehicle.physics.drivetrain == "fwd") {
                vehicle.applyEngineForce(engineForce, 0);
                vehicle.applyEngineForce(engineForce, 1);
              } else if (vehicle.physics.drivetrain == "rwd") {
                vehicle.applyEngineForce(engineForce, 2);
                vehicle.applyEngineForce(engineForce, 3);
              } else if (vehicle.physics.drivetrain == "awd") {
                vehicle.applyEngineForce(engineForce, 0);
                vehicle.applyEngineForce(engineForce, 1);
                vehicle.applyEngineForce(engineForce, 2);
                vehicle.applyEngineForce(engineForce, 3);
              }
            }
          },
          updatePhysics: function() {
            if (vehicle.mesh) {
              const velocity = vehicle.chassisBody.velocity.clone();
              const v = velocity.length();
              const dragForce = 0.5 * 1.225 * 0.3 * utils.physics.aerodynamicArea() * v * v * 50 * utils.physics.engineBrakeForce(v);
              vehicle.speed = v;
              if (v > 0) {
                velocity.normalize();
                velocity.scale(-dragForce, velocity);
                vehicle.body.applyForce(velocity, vehicle.body.position);
              }
              vehicle.mesh.position.copy(vehicle.body.position);
              vehicle.mesh.quaternion.copy(vehicle.body.quaternion);
              for (let i = 0; i < vehicle.wheelInfos.length; i++) {
                const wheel = vehicle.wheelInfos[i];
                vehicle.updateWheelTransform(wheel.index);
                wheel.body.position.copy(wheel.worldTransform.position);
                wheel.body.quaternion.copy(wheel.worldTransform.quaternion);
                wheel.mesh.position.copy(wheel.body.position);
                wheel.mesh.quaternion.copy(wheel.body.quaternion);
              }
              const shadowOffset = Math.abs(vehicle.mesh.rotation.y / 10);
              vehicle.shadow.position.set(vehicle.mesh.position.x + shadowOffset, 0, vehicle.mesh.position.z + shadowOffset);
              vehicle.shadow.rotation.z = vehicle.mesh.rotation.y - Math.PI / 2;
              vehicle.shadow.scale.set(vehicle.shadow.shadowSize[0] + shadowOffset, vehicle.shadow.shadowSize[1] + shadowOffset, 0);
            }
          },
          updateView: function() {
            const view = utils.vehicles[chosenVehicle].views[vehicle.currentView];
            if (vehicle.currentView == 0) {
              const oldRotation = camera.rotation.clone();
              camera.position.copy(vehicle.mesh.position);
              camera.rotation.copy(vehicle.mesh.rotation);
              camera.translateX(view[0]);
              camera.translateY(view[1]);
              camera.translateZ(view[2]);
              camera.rotation.copy(oldRotation);
              camera.rotation.y += vehicle.mesh.rotation.y - vehicle.physics.lastRotation;
              vehicle.physics.lastRotation = vehicle.mesh.rotation.y;
            } else {
              camera.position.copy(vehicle.mesh.position);
              camera.rotation.set(0, vehicle.mesh.rotation.y, 0);
              camera.translateX(view[0]);
              camera.translateY(view[1]);
              camera.translateZ(view[2]);
              camera.rotateX(view[3]);
              camera.rotateY(view[4]);
              camera.rotateZ(view[5]);
            }
          },
          updateLights: function(time) {
            if (vehicle.physics.blinker) {
              if (time - vehicle.physics.lastBlinker > 400) {
                vehicle.physics.lastBlinker = time;
                if (utils.vehicle.lightsInUse[vehicle.physics.blinker]) {
                  utils.vehicle.setLights(false, vehicle.physics.blinker);
                } else {
                  utils.vehicle.setLights(true, vehicle.physics.blinker);
                }
              }
            }
          },
          setLights: function(on, type = null) {
            const bloom_l = vehicle.model.getObjectByName("Light_Bloom");
            const bloom_r = vehicle.model.getObjectByName("Light_Bloom1");
            if (type == "brake") {
              if (on) {
                vehicle.model.getObjectByName("Brake_Lights").material.emissive.setHex(0xff0000);
                bloom_l.visible = true;
                bloom_l.material.opacity = 0.2;
                bloom_l.material.color.setHex(0xffaaaa);
                bloom_r.visible = true;
                bloom_r.material.opacity = 0.2;
                bloom_r.material.color.setHex(0xffaaaa);
              } else {
                vehicle.model.getObjectByName("Brake_Lights").material.emissive.setHex(0x000000);
                if (utils.vehicle.lightsInUse["blinker_r"]) {
                  bloom_l.visible = false;
                } else if (utils.vehicle.lightsInUse["blinker_l"]) {
                  bloom_r.visible = false;
                }
              }
            } else if (type == "reverse") {
              if (on) {
                vehicle.model.getObjectByName("Reverse_Lights").visible = true;
                bloom_l.visible = true;
                bloom_l.material.opacity = 0.3;
                bloom_l.material.color.setHex(0xffffdd);
                bloom_r.visible = true;
                bloom_r.material.opacity = 0.3;
                bloom_r.material.color.setHex(0xffffdd);
              } else {
                vehicle.model.getObjectByName("Reverse_Lights").visible = false;
              }
            } else if (type == "blinker_l") {
              if (on) {
                vehicle.model.getObjectByName("Blinker_L").visible = true;
                bloom_l.visible = true;
                bloom_l.material.opacity = 0.4;
                bloom_l.material.color.setHex(0xffffff);
              } else {
                vehicle.model.getObjectByName("Blinker_L").visible = false;
              }
            } else if (type == "blinker_r") {
              if (on) {
                vehicle.model.getObjectByName("Blinker_R").visible = true;
                bloom_r.visible = true;
                bloom_r.material.opacity = 0.4;
                bloom_r.material.color.setHex(0xffffff);
              } else {
                vehicle.model.getObjectByName("Blinker_R").visible = false;
              }
            }
            if (on) {
              utils.vehicle.lightsInUse[type] = true;
            } else {
              utils.vehicle.lightsInUse[type] = false;
              let lightsOn = 0;
              for (light in utils.vehicle.lightsInUse) {
                if (type == null) {
                  utils.vehicle.setLights(false, light);
                } else if (utils.vehicle.lightsInUse[light]) utils.vehicle.setLights(true, light), lightsOn++;
              }
              if (lightsOn <= 0) bloom_l.visible = false, bloom_r.visible = false;
            }
          }
        },
        physics: {
          engineBrakeForce: function(v) {
            return v < 2.5 ? 30 : 1;
          },
          aerodynamicArea: function() {
            return vehicle.currentVehicleSpeedKmHour < 0 ? vehicle.physics.rearArea : vehicle.physics.frontArea;
          },
          calculateHeadingReset: function(a, v) {
            const resetStrength = 0.8;
            const maxResetRate = Math.min(Math.max(v, 15), 30);
            let correctionAngularVelocity = -resetStrength * a * v;
            if (correctionAngularVelocity > maxResetRate) correctionAngularVelocity = maxResetRate;
            if (correctionAngularVelocity < -maxResetRate) correctionAngularVelocity = -maxResetRate;
            return correctionAngularVelocity / 30;
          }
        },
        map: {
          initialize: function() {
            new THREE.GLTFLoader().load("map.glb", function(model) {
              map = model.scene;
              map.traverse(child => {
                child.castShadow = true;
                child.receiveShadow = true;
                if (child.material) {
                  child.material.metalness = 0.1;
                  child.material.roughness = 1;
                }
                if (child.name == "Plane009" || child.name == "vegetation_long_grass_04_0001" || child.name == "Mesh_2_6") {
                  child.material.map.anisotropy = 4;
                  child.material.map.needsUpdate = true;
                }
              });
              scene.add(map);
              const collisionMap = map.getObjectByName("CollisionMap");
              collisionMap.traverse(child => {
                if (child.isMesh) {
                  const rotation = new THREE.Vector3(child.rotation.x, child.rotation.y, child.rotation.z);
                  child.rotation.set(0, 0, 0);
                  const box = new THREE.Box3().setFromObject(child);
                  const size = box.getSize(new THREE.Vector3());
                  const shape = new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2));
                  const body = new CANNON.Body({ mass: 0, shape: shape, material: groundMaterial });
                  world.add(body);
                  child.rotation.set(rotation.x, rotation.y, rotation.z);
                  box.setFromObject(child);
                  const worldPosition = box.min.add(box.max).divide(new THREE.Vector3(2, 2, 2));
                  body.position.set(worldPosition.x, worldPosition.y, worldPosition.z);
                  body.quaternion.copy(child.quaternion);
                }
              });
              map.remove(collisionMap);
              sky = new THREE.Mesh(new THREE.SphereGeometry(500, 25, 25), new THREE.MeshBasicMaterial({ color: 0xffffff, map: new THREE.TextureLoader().load("0.png"), side: THREE.BackSide }));
              sky.rotation.y = -0.3;
              scene.add(sky);
              utils.game.start();
            });
          }
        },
        game: {
          start: function() {
            renderer.shadowMap.needsUpdate = true;
            utils.game.controls.switchView(0);
            animate();
          },
          controls: {
            switchView: function(view = null) {
              let newView = view || vehicle.currentView + 1;
              if (typeof utils.vehicles[chosenVehicle].views[newView] == "undefined") newView = 0;
              if (newView == 0) {
                vehicle.physics.lastRotation = 0;
                camera.rotation.set(-0.1, Math.PI, 0);
                vehicle.model.getObjectByName("Interior").visible = true;
                vehicle.model.getObjectByName("Exterior").visible = false;
                vehicle.model.getObjectByName("Mirror_L").material.map = utils.vehicle.mirrorRenderTarget.texture;
                vehicle.model.getObjectByName("Mirror_L").material.envMap = null;
                vehicle.model.getObjectByName("Windows").material.opacity = 0.3;
                PointerControls.isLocked = true;
              } else {
                vehicle.model.getObjectByName("Interior").visible = false;
                vehicle.model.getObjectByName("Exterior").visible = true;
                vehicle.model.getObjectByName("Mirror_L").material.map = null;
                vehicle.model.getObjectByName("Mirror_L").material.envMap = utils.vehicle.envMap;
                vehicle.model.getObjectByName("Windows").material.opacity = 0.7;
                PointerControls.isLocked = false;
              }
              vehicle.currentView = newView;
            },
            brake: function() {
              if (vehicle.physics.throttle) utils.game.controls.stopThrottle();
              vehicle.physics.brake = true;
              utils.vehicle.setLights(true, "brake");
            },
            stopBrake: function() {
              vehicle.physics.brake = false;
              utils.vehicle.setLights(false, "brake");
            },
            throttle: function() {
              if (vehicle.physics.brake) utils.game.controls.stopBrake();
              vehicle.physics.throttle = true;
            },
            stopThrottle: function() {
              vehicle.physics.throttle = false;
            },
            leftBlinker: function() {
              utils.vehicle.setLights(false, "blinker_r");
              if (vehicle.physics.blinker == "blinker_l") {
                vehicle.physics.blinker = false;
                utils.vehicle.setLights(false, "blinker_l");
              } else {
                vehicle.physics.blinker = "blinker_l";
              }
            },
            rightBlinker: function() {
              utils.vehicle.setLights(false, "blinker_l");
              if (vehicle.physics.blinker == "blinker_r") {
                vehicle.physics.blinker = false;
                utils.vehicle.setLights(false, "blinker_r");
              } else {
                vehicle.physics.blinker = "blinker_r";
              }
            },
            stopBlinker: function() {
              utils.vehicle.setLights(false, vehicle.physics.blinker);
              vehicle.physics.blinker = false;
            }
          }
        }
      };

      const groundMaterial = new CANNON.Material("groundMaterial");
      const wheelMaterial = new CANNON.Material("wheelMaterial");
      const carMaterial = new CANNON.Material("carMaterial");
      const wheelGroundContactMaterial = new CANNON.ContactMaterial(wheelMaterial, groundMaterial, { friction: 0.3/*, restitution: 0, contactEquationStiffness: 1000*/ });
      world.addContactMaterial(wheelGroundContactMaterial);
      const carGroundContactMaterial = new CANNON.ContactMaterial(carMaterial, groundMaterial, { friction: 0.01 });
      world.addContactMaterial(carGroundContactMaterial);

      document.addEventListener("keydown", function(event) {
        keyStates[event.key] = true;
        if (!event.repeat) {
          if (event.key == "v") utils.game.controls.switchView();
          if (event.key == "b") utils.game.controls.brake();
          if (event.key == "ArrowUp") utils.game.controls.throttle();
          if (event.key == "[") utils.game.controls.leftBlinker();
          if (event.key == "]") utils.game.controls.rightBlinker();
        }
      });
      document.addEventListener("keyup", function(event) {
        keyStates[event.key] = false;
        if (event.key == "b") utils.game.controls.stopBrake();
        if (event.key == "ArrowUp") utils.game.controls.stopThrottle();
      });

      new THREE.GLTFLoader().load("propcars.glb", function(model) {
        const cars = model.scene.getObjectByName("Wrapper").children;
        for (let i = cars.length - 1; i >= 0; i--) {
          const car = cars[i];
          car.position.set(300, 0, 17);
          car.rotation.set(-Math.PI / 2 - 0.05, 0, -Math.PI / 2);
          car.scale.set(0.8, 0.8, 0.8);
          scene.add(car);
          propCars.push(car);
        }
      });

      utils.vehicle.initialize();

      const PointerControls = new PointerLockControls(camera, renderer.domElement);
      PointerControls.maxPolarAngle = Math.PI - 0.15;
      PointerControls.minPolarAngle = 0.15;
      PointerControls.pointerSpeed = 0.6;
      PointerControls.isLocked = false;
    </script>
  </body>
</html>
