<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Master 5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(180deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
      }
      .nav-bar {
        position: absolute;
        width: 100%;
        height: 100px;
        left: 0;
        right: 0;
        top: 0;
        margin: 0;
      }
      .nav-bar .button.nav-button {
        position: relative;
        background: #aab7ec;
        border: 4px solid #98b6fc;
        border-radius: 10px;
        background-size: 50%;
        background-repeat: no-repeat;
        background-position: center;
        box-shadow: 0 4px 0 #ddd;
        cursor: pointer;
        color: #fff;
        font-size: 18px;
        padding: 2px 10px;
        top: 20px;
        left: 20px;
        margin-left: 8px;
      }
      .nav-bar .button.nav-button-settings {
        width: 36px;
        height: 36px;
        background-image: url(images/menu/settings.png);
        background-size: 100%;
        float: right;
        left: -20px;
      }
      .header {
        position: relative;
        z-index: 6;
        pointer-events: none !important;
      }
      .header .heading {
        position: relative;
        color: #fff;
        /* text-shadow: -2px -2px 0 #333, 2px -2px 0 #333, -2px 2px 0 #333, 2px 2px 0 #333; */
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 2px;
        -webkit-text-stroke-color: #333;
        font-weight: 600;
        font-size: 65px;
        text-align: center;
        margin: 0;
        top: 20px;
      }
      .header .version {
        text-align: center;
        font-size: 150px;
        font-weight: 600;
        color: #999;
        text-shadow: 5px 10px #000;
        letter-spacing: 8px;
        font-family: "Roboto", Arial;
      }
      .buttons-wrapper {
        position: absolute;
        width: 900px;
        height: 210px;
        left: 50%;
        top: 50%;
        margin-left: -450px;
        margin-top: -30px;
        z-index: 7;
      }
      .buttons-wrapper .button {
        position: absolute;
        width: 100px;
        height: 100px;
        background: #aab7ec;
        border: 4px solid #98b6fc;
        border-radius: 100%;
        background-size: 50%;
        background-repeat: no-repeat;
        background-position: center;
        box-shadow: 0 6px 0 #ddd;
        cursor: pointer;
      }
      .buttons-wrapper .button:hover {
        transform: scale(1.1);
      }
      .buttons-wrapper .button:active {
        transform: scale(0.9);
      }
      .buttons-wrapper .play-button {
        left: 0;
        bottom: 0;
        background-image: url(images/menu/play-button.png);
      }
      .buttons-wrapper .cars-button {
        top: 0;
        left: 50%;
        margin-left: -50px;
        background-image: url(images/menu/cars-button.png);
      }
      .buttons-wrapper .multiplayer-button {
        right: 0;
        bottom: 0;
        background-image: url(images/menu/multiplayer-button.png);
      }
      .current-car-wrapper {
        position: absolute;
        bottom: 0;
        width: 850px;
        left: 50%;
        margin-left: -425px;
      }
      .current-car-wrapper .current-car-image {
        position: relative;
        width: 100%;
        top: 130px;
        margin-bottom: 10px;
      }
      .current-car-title, .current-car-text {
        position: relative;
        z-index: 2;
        text-align: center;
        font-size: 18px;
      }
      .current-car-title {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .trees {
        position: absolute;
        z-index: 5;
        width: 115%;
        margin-left: -7.5%;
        bottom: -100px;
        pointer-events: none !important;
      }
      .skid-marks {
        position: absolute;
        z-index: 4;
        width: 1500px;
        left: 0;
        right: 0;
        top: 120px;
        margin: 0 auto;
        pointer-events: none !important;
      }
      .arrow-icon {
        float: right;
        margin-right: -10px;
      }
      .account {
        position: relative;
        width: 250px;
        float: right;
        top: 16px;
        right: 10px;
        pointer-events: none !important;
      }
      .account .profile-picture {
        width: 55px;
        height: 55px;
        background-image: url(https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/img/profile-picture.png);
        background-size: 100%;
        float: left;
        margin-right: 6px;
      }
      .account .username {
        display: inline-block;
        border-bottom: 2px solid #333;
        font-size: 20px;
      }
      .account .points {
        font-size: 26px;
      }
      .copyright {
        position: absolute;
        right: 10px;
        bottom: 20px;
        z-index: 6;
        font-family: "Roboto", Arial;
        font-weight: 400;
        color: #888;
      }
      a {
        color: #9ab8ff !important;
      }
      .tippy-box {
        background-color: #ccc;
        color: #fff;
      }
      .tippy-box::before {
        border: none;
        background: #ddd;
      }
      .tippy-arrow {
        background: #ddd;
      }
      @media only screen and (max-height:700px) {
        .skid-marks {
          width: 1200px;
        }
        .current-car-wrapper {
          width: 700px;
          margin-left: -350px;
        }
      }
      @media only screen and (max-height:640px) {
        .skid-marks {
          width: 1000px;
        }
      }
      @media only screen and (max-height:590px) {
        .skid-marks {
          width: 900px;
        }
        .header .version {
          font-size: 120px;
          text-shadow: 2px 5px #000;
          letter-spacing: 4px;
        }
        .buttons-wrapper {
          width: 700px;
          margin-left: -350px;
        }
        .buttons-wrapper .button {
          width: 85px;
          height: 85px;
        }
      }
      @media only screen and (max-height:540px) {
        .current-car-text, .current-car-title {
          display: none;
        }
        .current-car-image {
          padding-bottom: 20px;
        }
        .header .heading {
          font-size: 50px;
          top: 10px;
        }
        .header .version {
          font-size: 90px;
        }
        .buttons-wrapper {
          height: 180px;
          margin-top: -10px;
        }
        .skid-marks {
          top: 90px;
        }
      }
      @media only screen and (max-height:490px) {
        .skid-marks {
          width: 700px;
          top: 80px;
        }
        .buttons-wrapper {
          margin-top: -30px;
          width: 600px;
          height: 170px;
          margin-left: -300px;
        }
        .buttons-wrapper .button {
          box-shadow: 0 4px 0 #ddd;
          width: 75px;
          height: 75px;
        }
      }
      @media only screen and (max-height:450px) {
        .skid-marks {
          top: 65px;
          width: 90% !important;
        }
        .buttons-wrapper {
          width: 550px;
          margin-left: -275px;
          height: 150px;
          margin-top: -20px;
        }
        .buttons-wrapper .button {
          width: 60px;
          height: 60px;
        }
        .buttons-wrapper .cars-button {
          margin-left: -30px;
        }
      }
      @media only screen and (max-width:1100px) {
        .skid-marks {
          width: 95% !important;
        }
        .account {
          width: 190px;
        }
        .account .profile-picture {
          width: 45px;
          height: 45px;
        }
        .account .username {
          font-size: 16px;
        }
        .account .points {
          font-size: 22px;
        }
      }
      @media only screen and (max-width:880px) {
        .account {
          width: 120px;
        }
        .account .profile-picture {
          display: none;
        }
        .account .username {
          font-size: 16px;
        }
        .account .points {
          font-size: 22px;
        }
        .nav-bar .button.nav-button {
          left: 10px;
          top: 10px;
          border-radius: 8px;
          font-size: 14px;
          padding: 2px 6px;
        }
        .nav-bar .button.nav-button-settings {
          left: -10px;
          width: 32px;
          height: 32px;
        }
        .arrow-icon {
          height: 20px;
        }
        .header .heading {
          font-size: 46px;
          top: 5px;
        }
        .current-car-wrapper {
          width: 650px;
          margin-left: -325px;
        }
      }
      @media only screen and (max-width:810px) {
        .buttons-wrapper {
          width: 500px;
          margin-left: -250px;
        }
        .trees {
          bottom: -50px;
        }
        .current-car-wrapper {
          width: 600px;
          margin-left: -300px;
        }
        .current-car-image {
          padding-bottom: 30px;
        }
      }
      @media only screen and (max-width:730px) {
        .nav-bar .button.nav-button {
          border-radius: 6px;
          font-size: 12px;
          padding: 0 4px;
        }
        .nav-bar .button.nav-button-settings {
          width: 24px;
          height: 24px;
        }
        .arrow-icon {
          height: 16px;
        }
      }
      .loading-banner {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        z-index: 999999;
        opacity: 1;
        transition: opacity .2s;
        pointer-events: none !important;
      }
      .spinner {
        position: absolute;
        width: 180px;
        height: 180px;
        border: 10px solid #ddd;
        border-radius: 100%;
        border-top: 10px solid #47b3ff;
        display: flex;
        text-align: center;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-family: "Roboto", Arial;
        color: #47b3ff;
        left: 50%;
        top: 50%;
        margin-left: -90px;
        margin-top: -90px;
        box-sizing: border-box;
        animation: spin 2s linear infinite;
      }
      .spinner .loading-progress {
        animation: spin 2s reverse linear infinite;
      }
    </style>
  </head>
  <body>
    <audio id="menu-audio" src="https://cdn.jsdelivr.net/gh/Parking-Master/Parking-Master@latest/index/menu-audio.mp3" autoplay="" loop=""></audio>
    <div class="loading-banner">
      <div class="spinner"><div class="loading-progress">0%</div></div>
    </div>
    <div class="nav-bar">
      <button class="button nav-button nav-button-login" onclick="location.href = 'login.html'">Log in <img src="images/menu/arrow-right.png" class="arrow-icon"></button>
      <button class="button nav-button nav-button-login" onclick="location.href = 'signup.html'">Sign up <img src="images/menu/arrow-right.png" class="arrow-icon"></button>
      <button class="button nav-button nav-button-settings"></button>
      <div class="account">
        <div class="profile-picture"></div>
        <div class="username">GuestUser1234</div>
        <div class="points">50 PTS</div>
      </div>
    </div>
    <div class="header">
      <h1 class="heading">Parking Master</h1>
      <div class="version">5.0</div>
    </div>
    <img src="images/menu/skid-marks.png" class="skid-marks">
    <div class="wrapper">
      <div class="buttons-wrapper">
        <button class="button play-button" onclick="location.href = 'src.html'" data-tippy-content="Play" data-tippy-arrow="false"></button>
        <button class="button cars-button" onclick="location.href = 'cars.html'" data-tippy-content="Your Cars" data-tippy-arrow="false"></button>
        <button class="button multiplayer-button" data-tippy-content="Multiplayer" data-tippy-arrow="false"></button>
      </div>
      <div class="current-car-wrapper">
        <img src="images/cars/Honda_Civic.png" class="current-car-image">
        <div class="current-car-title">Current Car</div>
        <div class="current-car-text"><span style="font-weight:600">2018</span> HONDA CIVIC SPORT TOURING</p></div>
      </div>
      <div class="copyright">&copy; 2021-2026 <a href="https://github.com/Parking-Master">Parking Master</a></div>
      <img src="images/menu/trees.png" class="trees">
    </div>
    <script src="scripts/tippy.js"></script>
    <script>
      tippy("[data-tippy-content]");
      let currentProgress = 0;
      function animate() {
        if (currentProgress >= 100) return document.querySelector(".loading-banner").style.opacity = 0;
        currentProgress += 2;
        document.querySelector(".loading-progress").textContent = currentProgress + "%";
        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
